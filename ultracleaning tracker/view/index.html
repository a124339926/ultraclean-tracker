<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UltraClean Tracker - 唯讀模式</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   UltraClean Tracker v5.0 — Viewer Design System
   Dark dashboard · Warm copper accent · Glass depth · Swiss typography
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg: #080812;
  --bg-elevated: #0e0e1a;
  --card: #11111f;
  --card-hover: #16162a;
  --card-border: rgba(255,255,255,0.04);
  --sidebar: #0a0a14;
  --sidebar-hover: #151528;
  --sidebar-active: rgba(201,148,110,0.10);
  --accent: #c9946e;
  --accent-glow: rgba(201,148,110,0.15);
  --text: #e4e4ec;
  --text-secondary: #9a9aaa;
  --muted: #5e5e72;
  --danger: #e0556a;
  --danger-bg: rgba(224,85,106,0.10);
  --success: #4dab8e;
  --success-bg: rgba(77,171,142,0.10);
  --primary: #5b8cc9;
  --primary-bg: rgba(91,140,201,0.10);
  --purple: #8b6fbf;
  --warning: #d4a843;
  --info: #6ebccf;
  --danger-hover: #c43b50;
  --success-hover: #3d9478;
  --radius: 10px;
  --radius-sm: 7px;
  --radius-xs: 5px;
  --radius-lg: 14px;
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow-card: 0 1px 3px rgba(0,0,0,0.4), 0 0 0 1px var(--card-border);
  --shadow-modal: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06);
  --transition-fast: 120ms ease;
  --transition-base: 200ms ease;
  --transition-slow: 300ms cubic-bezier(0.4,0,0.2,1);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--text);
  display:flex;
  min-height:100vh;
  scroll-behavior:smooth;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.01em;
}

body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.025'/%3E%3C/svg%3E");
  opacity:.5
}

/* ═══════════════ SIDEBAR ═══════════════ */
.sidebar{
  width:240px;min-width:140px;flex-shrink:0;
  background:var(--sidebar);
  display:flex;flex-direction:column;
  padding:24px 0 16px;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;overflow-x:hidden;
  border-right:1px solid rgba(255,255,255,0.04);
}
.sidebar-resize{
  width:4px;min-width:4px;cursor:col-resize;
  background:transparent;transition:background var(--transition-base);
  flex-shrink:0;position:relative;z-index:2;
}
.sidebar-resize::after{
  content:'';position:absolute;inset:0 -3px;
}
.sidebar-resize:hover,.sidebar-resize.active{background:var(--accent);opacity:.8}
body.sidebar-resizing{cursor:col-resize!important;user-select:none!important}

.sidebar .logo{padding:0 18px;margin-bottom:22px}
.sidebar .logo h1{font-size:15px;color:var(--accent);font-weight:700;letter-spacing:-0.02em}
.sidebar .logo span{font-size:10.5px;color:var(--muted);font-weight:500;display:block;margin-top:2px}

.sidebar .readonly-badge{
  margin:0 18px 10px;
  font-size:10px;
  color:var(--accent);
  font-weight:600;
  padding:5px 10px;
  background:var(--sidebar-active);
  border-radius:var(--radius-xs);
  text-transform:uppercase;
  letter-spacing:0.08em;
  border-left:2px solid var(--accent);
}

.sidebar .nav-title{
  font-size:10px;color:var(--muted);font-weight:600;
  padding:0 18px;margin-bottom:6px;
  text-transform:uppercase;letter-spacing:0.08em;
}
.sidebar .nav-btn{
  display:flex;align-items:center;gap:10px;
  width:calc(100% - 12px);
  text-align:left;padding:9px 14px;margin:1px 6px;
  border:none;background:transparent;color:var(--text-secondary);
  font-size:12.5px;font-family:var(--font);font-weight:500;
  border-radius:var(--radius-sm);
  cursor:pointer;transition:all var(--transition-fast);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-0.01em;
}
.sidebar .nav-btn .nav-icon{font-size:15px;width:18px;text-align:center;flex-shrink:0;line-height:1}
.sidebar .nav-btn:hover{background:var(--sidebar-hover);color:var(--text)}
.sidebar .nav-btn.active{background:var(--sidebar-active);color:var(--accent);font-weight:600}

/* ═══════════════ MAIN AREA ═══════════════ */
.main{
  flex:1;display:flex;flex-direction:column;
  padding:0;height:100vh;overflow:hidden;min-width:0;
}
.main-content{padding:20px 24px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-scroll{
  flex:1;overflow-y:auto;overflow-x:auto;
  min-height:0;scroll-behavior:smooth;
  border-radius:var(--radius);
}
.main-scroll::-webkit-scrollbar,
.scroll::-webkit-scrollbar{width:5px;height:5px}
.main-scroll::-webkit-scrollbar-track,
.scroll::-webkit-scrollbar-track{background:transparent}
.main-scroll::-webkit-scrollbar-thumb,
.scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.06);border-radius:3px;
}
.main-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.10)}

/* ═══════════════ TOOLBAR ═══════════════ */
.toolbar{
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;margin-bottom:14px;
  padding-bottom:0;
}
.toolbar h2{
  font-size:17px;font-weight:700;
  margin-right:auto;color:var(--text);
  letter-spacing:-0.02em;
}

/* ═══════════════ BUTTONS ═══════════════ */
.btn{
  padding:7px 14px;border:none;border-radius:var(--radius-xs);
  font-size:12px;cursor:pointer;font-weight:600;
  font-family:var(--font);letter-spacing:-0.01em;
  transition:all var(--transition-fast);
  white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:scale(.97) translateY(0)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-sm{padding:5px 10px;font-size:11px}

.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-gray{background:rgba(255,255,255,0.08);color:var(--text-secondary)}
.btn-gray:hover{background:rgba(255,255,255,0.12);color:var(--text)}
.btn-accent{background:var(--accent);color:#16120d;font-weight:700}
.btn-accent:hover{filter:brightness(1.08)}
.btn-outline{
  background:transparent;
  border:1px solid rgba(255,255,255,0.08);
  color:var(--text-secondary);
}
.btn-outline:hover{background:rgba(255,255,255,0.04);color:var(--text);border-color:rgba(255,255,255,0.14)}

/* ═══════════════ INPUTS ═══════════════ */
input,select,textarea{
  background:var(--bg-elevated);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius-xs);
  color:var(--text);padding:7px 10px;
  font-size:12px;font-family:var(--font);
  outline:none;transition:border-color var(--transition-fast);
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px var(--accent-glow);
}
select{
  min-width:120px;cursor:pointer;color-scheme:dark;
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%239a9aaa'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
  padding-right:28px;
}
select option{background:#1a1a2e;color:var(--text)}

/* ═══════════════ TABLE HEADER ═══════════════ */
.table-header{
  display:flex;background:var(--card);
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  padding:0;font-size:11.5px;font-weight:600;
  color:var(--muted);overflow:hidden;
  border:1px solid var(--card-border);
  border-bottom:none;
}
.table-header span{
  padding:10px 6px;cursor:pointer;user-select:none;
  letter-spacing:-0.01em;position:relative
}
.table-header span:hover{background:rgba(255,255,255,0.02);color:var(--text-secondary)}
.table-header span .sort-arrow{color:var(--accent);font-size:9px;margin-left:2px}
.resize-handle{
  position:absolute;right:0;top:0;bottom:0;
  width:5px;cursor:col-resize;z-index:5;transition:background var(--transition-fast);
}
.resize-handle:hover,.resize-handle.active{background:var(--accent);opacity:.5}
.table-header span:last-child .resize-handle{display:none}
body.col-resizing{cursor:col-resize!important;user-select:none!important}
body.col-resizing .table-header span{cursor:col-resize!important}

/* ═══════════════ DATA ROWS ═══════════════ */
.row{
  display:flex;align-items:center;
  background:var(--card);
  border-radius:0;margin:0;padding:7px 0;
  font-size:12px;transition:all var(--transition-fast);
  border-bottom:1px solid rgba(255,255,255,0.02);
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--card-hover)}
.row span,.row .cell{
  padding:5px 6px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;line-height:1.4;
}

/* ═══════════════ CARDS ═══════════════ */
.card{
  background:var(--card);border-radius:var(--radius);
  padding:18px 20px;
  border:1px solid var(--card-border);
  box-shadow:var(--shadow-card);
  transition:all var(--transition-base);
}
.card:hover{border-color:rgba(255,255,255,0.08)}

.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:12px;
}

.status-card{
  display:flex;align-items:center;gap:10px;
  padding:13px 16px;
  background:var(--card);
  border-radius:var(--radius-sm);
  border:1px solid var(--card-border);
  transition:all var(--transition-fast);
}
.status-card:hover{background:var(--card-hover)}
.status-card .count{font-size:20px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums}

/* ═══════════════ BADGES & TAGS ═══════════════ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:var(--radius-xs);
  font-size:11px;font-weight:600;
}

.status-tag{
  padding:3px 10px;border-radius:var(--radius-xs);
  font-size:11px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;
  letter-spacing:-0.01em;
}
.status-tag .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ═══════════════ PAGING ═══════════════ */
.paging{
  display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--muted);
  margin-top:10px;padding:4px 0;
}

/* ═══════════════ MODAL ═══════════════ */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  z-index:100;animation:fadeIn var(--transition-fast);
}
.modal{
  background:var(--card);border-radius:var(--radius-lg);
  padding:26px 28px;width:90%;max-width:500px;
  max-height:85vh;overflow-y:auto;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:var(--shadow-modal);
  animation:slideUp var(--transition-slow);
}
.modal h3{margin-bottom:16px;font-size:16px;font-weight:700;letter-spacing:-0.015em}

/* ═══════════════ TOAST ═══════════════ */
.toast{
  position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
  background:var(--card);color:var(--text);
  padding:10px 24px;border-radius:24px;
  font-size:12px;font-weight:500;letter-spacing:-0.01em;
  z-index:200;
  border:1px solid rgba(255,255,255,0.08);
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
  animation:toastIn .3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ═══════════════ CHART WRAP ═══════════════ */
.chart-wrap{
  background:var(--card);border-radius:var(--radius);
  padding:20px;margin-bottom:14px;
  border:1px solid var(--card-border);
}
canvas{max-width:100%}

/* ═══════════════ UTILITY ═══════════════ */
.check-row{
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;margin:8px 0;padding:4px 0;
}
.empty{
  text-align:center;color:var(--muted);
  padding:48px 20px;font-size:13px;
}
.bar-outer{
  flex:1;background:var(--bg-elevated);
  border-radius:4px;height:16px;overflow:hidden;
  min-width:100px;border:1px solid rgba(255,255,255,0.03);
}
.bar-inner{
  height:100%;background:var(--success);
  border-radius:4px;transition:width var(--transition-slow);
}
.tab-bar{display:flex;gap:4px;margin-bottom:12px}

.report-box{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:22px 24px;
  font-family:"SF Mono","Cascadia Code","JetBrains Mono",monospace;
  font-size:12.5px;white-space:pre-wrap;line-height:1.65;
  flex:1;overflow-y:auto;min-height:0;color:var(--text-secondary);
}

.progress-row{
  display:flex;align-items:center;gap:10px;
  margin:5px 0;font-size:12px;
}
.progress-row .lbl{width:130px;min-width:130px;font-weight:500}

.scroll{overflow-y:auto;flex:1;min-height:0}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{width:100%;min-width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:10px;gap:4px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.04)}
  .sidebar .logo,.sidebar .nav-title,.sidebar .readonly-badge{display:none}
  .sidebar .nav-btn{width:auto;margin:2px;padding:7px 12px;font-size:11px}
  .sidebar .nav-btn .nav-icon{display:none}
  .main-content{padding:12px}
  .table-header span,.row span{font-size:10px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sidebar-resize{display:none}
}

@media print{
  body{background:#fff;color:#000}
  .sidebar{display:none}
  .toolbar .btn{display:none}
  .row{break-inside:avoid}
}
</style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<nav class="sidebar">
  <div class="logo"><h1>Ultra Cleaning</h1><span>影片工作流 v5.0</span></div>
  <div class="readonly-badge">唯讀模式</div>
  <div class="nav-title">功能選單</div>
  <button class="nav-btn active" data-page="projects"><span class="nav-icon">&#9632;</span> 專案管理</button>
  <button class="nav-btn" data-page="materials"><span class="nav-icon">&#9638;</span> 素材庫存</button>
  <button class="nav-btn" data-page="daily"><span class="nav-icon">&#9681;</span> 日報</button>
  <button class="nav-btn" data-page="weekly"><span class="nav-icon">&#9711;</span> 週報</button>
  <button class="nav-btn" data-page="dashboard"><span class="nav-icon">&#9776;</span> 狀態總覽</button>
  <button class="nav-btn" data-page="stats"><span class="nav-icon">&#9779;</span> 報表中心</button>
</nav>
<div class="sidebar-resize" id="sidebarResize"></div>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="main">
  <div class="main-content" id="main"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
const API_BASE = 'https://wood0807.pythonanywhere.com';

const STATUSES = ["素材歸檔","已停止","剪輯中","MKT審核中","MKT退回","老闆審核中","老闆退回","審核通過","文案撰寫中","準備排程","已排程","已發布"];
const STATUS_COLORS = {"素材歸檔":"#7a7a88","已停止":"#c46a8a","剪輯中":"#d4956b","MKT審核中":"#5b8cc9","MKT退回":"#e0556a","老闆審核中":"#8b6fbf","老闆退回":"#c43b50","審核通過":"#3d9478","文案撰寫中":"#4dab8e","準備排程":"#d4a843","已排程":"#6ebccf","已發布":"#2d7a5f"};

let CATEGORIES = {};
let ALL_CATEGORY_LABELS = [];

async function loadConfig() {
  try {
    const r = await fetch(`${API_BASE}/api/config`);
    const d = await r.json();
    CATEGORIES = d.categories || {};
    ALL_CATEGORY_LABELS = d.category_labels || [];
  } catch(e) { /* use defaults */ }
}
loadConfig();

// ── Navigation ────────────────────────────────────────────────
document.querySelectorAll('.nav-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    loadPage(b.dataset.page);
  };
});

// ── Toast ─────────────────────────────────────────────────────
function toast(msg) {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2500);
}

// ── API helpers ───────────────────────────────────────────────
async function api(url, opts={}) {
  const res = await fetch(`${API_BASE}${url}`, {
    headers: {'Content-Type':'application/json'},
    ...opts
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error||'Request failed'); }
  return res;
}

// ── Page loader ───────────────────────────────────────────────
async function loadPage(page) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty">載入中...</div>';
  try {
    switch(page) {
      case 'projects': await renderProjects(); break;
      case 'materials': await renderMaterials(); break;
      case 'daily': await renderDaily(); break;
      case 'weekly': await renderWeekly(); break;
      case 'dashboard': await renderDashboard(); break;
      case 'stats': await renderStats(); break;
    }
  } catch(e) { main.innerHTML = `<div class="empty" style="color:var(--danger)">錯誤：${e.message}</div>`; }
}

// ── Projects Page ─────────────────────────────────────────────
let projState = {sortCol:'updated_at',sortAsc:false,page:0,status:'',category:'',search:'',selected:new Set(),total:0};

async function renderProjects() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h2>專案管理</h2>
      <input id="projSearch" placeholder="搜尋名稱..." style="width:180px" oninput="projState.search=this.value;projState.page=0;renderProjects()">
      <select id="projStatusFilter" onchange="projState.status=this.value;projState.page=0;renderProjects()">
        <option value="">全部狀態</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}
      </select>
      <select id="projCatFilter" onchange="projState.category=this.value;projState.page=0;renderProjects()">
        <option value="">全部業務線</option>${ALL_CATEGORY_LABELS.map(l=>`<option>${l}</option>`).join('')}
      </select>
      <span class="badge" style="background:var(--accent-glow);color:var(--accent);font-size:10px;margin-left:auto;border:1px solid rgba(201,148,110,0.25)">唯讀</span>
    </div>
    <div class="table-header">
      <span style="width:50px" onclick="toggleSort('id')">ID <span class="sort-arrow">${sortArrow('id')}</span></span>
      <span style="width:270px" onclick="toggleSort('name')">影片名稱 <span class="sort-arrow">${sortArrow('name')}</span></span>
      <span style="width:90px" onclick="toggleSort('category')">業務線 <span class="sort-arrow">${sortArrow('category')}</span></span>
      <span style="width:100px" onclick="toggleSort('current_status')">狀態 <span class="sort-arrow">${sortArrow('current_status')}</span></span>
      <span style="width:130px">備註</span>

function sortArrow(col) { return projState.sortCol===col ? (projState.sortAsc?'▲':'▼') : ''; }
function toggleSort(col) {
  if(projState.sortCol===col) projState.sortAsc=!projState.sortAsc; else {projState.sortCol=col;projState.sortAsc=true;}
  projState.page=0; renderProjects();
}

async function loadProjects() {
  const p = projState;
  const params = new URLSearchParams({
    sort_col:p.sortCol, sort_asc:p.sortAsc, page:p.page, limit:200,
    status:p.status, category:p.category, search:p.search
  });
  const res = await api(`/api/projects?${params}`);
  const data = await res.json();
  p.total = data.total;
  renderProjectRows(data.projects);
  renderPaging(data.total, data.projects.length);
}

function renderProjectRows(projects) {
  const list = document.getElementById('projList');
  if(!projects.length) { list.innerHTML='<div class="empty">尚無專案</div>'; return; }
  list.innerHTML = projects.map(r => {
    const cat = CATEGORIES[r.category] || r.category;
    const color = STATUS_COLORS[r.current_status]||'#fff';
    const updated = (r.updated_at||'').substring(0,10);
    const editD = (r.edit_date||'').substring(0,10)||'未設定';
    const revD = (r.review_date||'').substring(0,10)||'未設定';
    const pubD = (r.publish_date||'').substring(0,10)||'未設定';
    return `<div class="row" data-id="${r.id}">
      <span style="width:50px">${r.id}</span>
      <span style="width:270px" title="${r.name}">${r.name}</span>
      <span style="width:90px">${cat}</span>
      <span style="width:100px">
        <span class="status-tag" style="background:${color}18;color:${color};border:1px solid ${color}33">
          <span class="dot" style="background:${color}"></span>${r.current_status}
        </span>
      </span>
      <span style="width:130px;color:var(--muted)">${(r.note||'').substring(0,20)}</span>
      <span style="width:90px;color:${editD!=='未設定'?'#9ec5fe':'var(--muted)'}">${editD}</span>
      <span style="width:90px;color:${revD!=='未設定'?'var(--warning)':'var(--muted)'}">${revD}</span>

function renderPaging(total, current) {
  const totalPages = Math.max(1, Math.ceil(total/200));
  const page = projState.page + 1;
  let html = `顯示 ${current} / 共 ${total} 筆　第 ${page}/${totalPages} 頁 `;
  if(page>1) html += `<button class="btn btn-sm btn-gray" onclick="projState.page--;renderProjects()">上一頁</button>`;
  if(page<totalPages) html += `<button class="btn btn-sm btn-gray" onclick="projState.page++;renderProjects()">下一頁</button>`;
  document.getElementById('projPaging').innerHTML = html;
}

function showModal(title, bodyHtml, onSave) {
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>${title}</h3>${bodyHtml}<div class="btn-row">
    <button class="btn btn-gray" onclick="this.closest('.modal-overlay').remove()">關閉</button>
    ${onSave ? '<button class="btn btn-accent" id="modalSave">確認</button>' : ''}
  </div></div>`;
  document.body.appendChild(overlay);
  if (onSave) overlay.querySelector('#modalSave').onclick = () => { onSave(overlay); };
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
}

async function showDetailModal(pid) {
  const res = await api(`/api/projects/${pid}/logs`);

  const el = document.querySelector(`[data-id="${pid}"]`);

  let html = `<h3>${name}</h3><div style="max-height:300px;overflow-y:auto;margin-bottom:10px">`;
  html += data.logs.map(l => {

    return `<div style="font-size:12px;padding:4px 0;color:var(--muted)">${l.changed_at} <span style="color:var(--text)">${arrow}</span></div>`;

}

      `).join('')}
    </div>

      <button class="btn btn-sm btn-gray" onclick="statsState.idx--;renderStats()">◀</button>
      <span id="statsLabel" style="font-weight:700;margin:0 15px;font-size:13px"></span>
      <button class="btn btn-sm btn-gray" onclick="statsState.idx++;renderStats()">▶</button>
      <button class="btn btn-sm btn-gray" onclick="statsState.idx=0;renderStats()" style="margin-left:auto">今天</button>
      <button class="btn btn-sm btn-outline" onclick="exportReport('statsContent','PNG')">匯出PNG</button>
      <button class="btn btn-sm btn-outline" onclick="exportReport('statsContent','JPG')">匯出JPG</button>

function switchPeriod(period) {
  statsState.period = period;
  document.querySelectorAll('#periodTabs .btn').forEach(b => {
    b.className = `btn btn-sm ${b.dataset.period===period?'btn-accent':'btn-outline'}`;
  });
  loadStats();
}

async function loadStats() {
  const res = await api(`/api/stats?period=${statsState.period}&idx=${statsState.idx}`);
  const d = await res.json();
  document.getElementById('statsLabel').textContent = d.label;

  let html = `<div class="card-grid" style="margin-bottom:16px">
    <div class="card" style="text-align:center;padding:20px"><div style="color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em">新建影片</div><div style="font-size:30px;font-weight:700;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums">${d.created.length}</div></div>
    <div class="card" style="text-align:center;padding:20px"><div style="color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em">有進度</div><div style="font-size:30px;font-weight:700;color:#d4956b;margin-top:4px;font-variant-numeric:tabular-nums">${d.active.length}</div></div>
    <div class="card" style="text-align:center;padding:20px"><div style="color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em">已發布</div><div style="font-size:30px;font-weight:700;color:var(--success);margin-top:4px;font-variant-numeric:tabular-nums">${d.published.length}</div></div>
  </div>`;

  if(Object.keys(d.status_counts).length) {
    html += '<h3 style="margin-bottom:8px;font-size:13px;font-weight:700;color:var(--text-secondary)">狀態分布</h3><div class="check-row">';
    const sorted = Object.entries(d.status_counts).sort((a,b)=>b[1]-a[1]);
    for(const [st,cnt] of sorted) {
      html += `<span class="badge" style="background:${STATUS_COLORS[st]||'#554c44'}18;color:${STATUS_COLORS[st]||'var(--text)'};border:1px solid ${STATUS_COLORS[st]||'#554c44'}33">${st} ×${cnt}</span>`;
    }
    html += '</div>';
  }

  const allCats = Object.keys(CATEGORIES);
  const hasData = allCats.some(k => (d.cat_created[k]||0)+(d.cat_active[k]||0)+(d.cat_published[k]||0) > 0);
  if(hasData) {
    html += '<h3 style="margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--text-secondary)">業務線明細</h3>';
    html += `<div class="card" style="overflow-x:auto;padding:14px"><table style="width:100%;font-size:12px;border-collapse:collapse">
      <tr style="color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.04em"><td style="padding:8px 12px">業務線</td><td style="padding:8px 12px;text-align:center">新建</td><td style="padding:8px 12px;text-align:center">有進度</td><td style="padding:8px 12px;text-align:center">已發布</td></tr>`;
    for(const k of allCats) {
      const cc=d.cat_created[k]||0, ca=d.cat_active[k]||0, cp=d.cat_published[k]||0;
      if(!cc&&!ca&&!cp) continue;
      html += `<tr><td style="padding:7px 12px;font-weight:500">${CATEGORIES[k]}</td><td style="padding:7px 12px;text-align:center;color:${cc?'var(--accent)':'var(--muted)'};font-weight:${cc?'600':'400'};font-variant-numeric:tabular-nums">${cc}</td><td style="padding:7px 12px;text-align:center;color:${ca?'#d4956b':'var(--muted)'};font-weight:${ca?'600':'400'};font-variant-numeric:tabular-nums">${ca}</td><td style="padding:7px 12px;text-align:center;color:${cp?'var(--success)':'var(--muted)'};font-weight:${cp?'600':'400'};font-variant-numeric:tabular-nums">${cp}</td></tr>`;
    }
    html += '</table></div>';
  } else {
    html += '<div class="empty">此期間尚無影片紀錄</div>';
  }

  html += '<h3 style="margin:20px 0 10px;font-size:13px;font-weight:700;color:var(--text-secondary)">數據圖表</h3><div id="chartsArea"></div>';

  document.getElementById('statsContent').innerHTML = html;

  setTimeout(() => renderCharts(d), 100);
}

function renderCharts(d) {
  const area = document.getElementById('chartsArea');
  if(!area) return;

  const catLabels = [], catValues = [];
  for(const [k,v] of Object.entries(d.cat_created)) {
    catLabels.push(CATEGORIES[k]||k); catValues.push(v);
  }

  const stLabels = Object.keys(d.status_counts);
  const stValues = Object.values(d.status_counts);
  const stColors = stLabels.map(s => STATUS_COLORS[s]||'#9a9490');

  const hasCatData = catValues.length && catValues.some(v=>v>0);
  const hasStData = stValues.length && stValues.some(v=>v>0);
  const hasTrend = d.trend.months && d.trend.months.length>0;

  if(!hasCatData && !hasStData && !hasTrend) {
    area.innerHTML = '<div class="empty">此期間尚無數據可繪製圖表</div>'; return;
  }

  area.innerHTML = `
    ${hasCatData ? '<div class="chart-wrap" style="max-width:480px"><canvas id="pieChart"></canvas></div>' : ''}
    ${hasStData ? '<div class="chart-wrap" style="max-width:500px"><canvas id="barChart"></canvas></div>' : ''}
    ${hasTrend ? '<div class="chart-wrap"><canvas id="lineChart"></canvas></div>' : ''}
  `;

  Chart.defaults.color = '#9a9aaa';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.04)';

  if(hasCatData) {
    new Chart(document.getElementById('pieChart'), {
      type:'pie', data:{labels:catLabels,datasets:[{data:catValues,backgroundColor:['#c9946e','#d4956b','#4dab8e','#d4a843','#6ebccf','#e0556a','#8b6fbf','#c46a8a','#7a7a88','#5b8cc9','#3d9478','#c43b50']}]},
      options:{plugins:{legend:{position:'bottom',labels:{font:{size:10,family:"'Plus Jakarta Sans',sans-serif"},color:'#9a9aaa',padding:12},onClick:function(){return false}}}}
    });
  }

  if(hasStData) {
    new Chart(document.getElementById('barChart'), {
      type:'bar', data:{labels:stLabels,datasets:[{data:stValues,backgroundColor:stColors,borderRadius:4}]},
      options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5e5e72',font:{size:10}}},y:{grid:{display:false},ticks:{color:'#9a9aaa',font:{size:10}}}}}
    });
  }

  if(hasTrend) {
    new Chart(document.getElementById('lineChart'), {
      type:'line', data:{labels:d.trend.months,datasets:[
        {label:'建立專案',data:d.trend.created,borderColor:'#c9946e',backgroundColor:'rgba(201,148,110,0.08)',tension:.35,fill:true,pointRadius:3,pointBackgroundColor:'#c9946e'},
        {label:'已發布',data:d.trend.published,borderColor:'#4dab8e',backgroundColor:'rgba(77,171,142,0.08)',tension:.35,fill:true,pointRadius:3,pointBackgroundColor:'#4dab8e'}
      ]},
      options:{plugins:{legend:{labels:{color:'#9a9aaa',font:{size:11},padding:16,usePointStyle:true}}},scales:{x:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5e5e72',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#5e5e72',font:{size:10}}}}}
    });
  }
}

// ── Export ────────────────────────────────────────────────────
async function exportReport(elementId, format) {
  const el = document.getElementById(elementId);
  if (!el) return toast('找不到報表內容');

  if (format === 'PDF') {
    const origWidth = el.style.width;
    const origOverflow = el.style.overflow;
    const origMaxH = el.style.maxHeight;
    el.style.width = '780px';
    el.style.overflow = 'visible';
    el.style.maxHeight = 'none';

    const canvas = await html2canvas(el, {
      backgroundColor: '#080812',
      scale: 2,
      logging: false,
    });

    el.style.width = origWidth;
    el.style.overflow = origOverflow;
    el.style.maxHeight = origMaxH;

    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW - 10;
    const imgH = (canvas.height * imgW) / canvas.width;

    let heightLeft = imgH;
    let position = 5;

    pdf.addImage(imgData, 'JPEG', 5, position, imgW, imgH);
    heightLeft -= pageH;

    while (heightLeft > 0) {
      position = heightLeft - imgH + 5;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 5, position, imgW, imgH);
      heightLeft -= pageH;
    }

    pdf.save(`report-${new Date().toISOString().slice(0,10)}.pdf`);
    toast('PDF 下載中...');
    return;
  }

  const mime = format === 'JPG' ? 'image/jpeg' : 'image/png';
  const ext = format === 'JPG' ? 'jpg' : 'png';

  const origOverflow = el.style.overflow;
  const origMaxH = el.style.maxHeight;
  el.style.overflow = 'visible';
  el.style.maxHeight = 'none';

  const canvas = await html2canvas(el, {
    backgroundColor: '#080812',
    scale: 2,
    logging: false,
  });

  el.style.overflow = origOverflow;
  el.style.maxHeight = origMaxH;

  const link = document.createElement('a');
  link.download = `report-${new Date().toISOString().slice(0,10)}.${ext}`;
  link.href = canvas.toDataURL(mime, 0.95);
  link.click();
  toast(`${format} 下載中...`);
}

// ── Column Resize ──────────────────────────────────────────────
let colResize = null;

function injectResizeHandles() {
  document.querySelectorAll('.table-header').forEach(header => {
    header.querySelectorAll('span').forEach(span => {
      if (!span.querySelector('.resize-handle')) {
        const h = document.createElement('div');
        h.className = 'resize-handle';
        span.appendChild(h);
      }
    });
  });
}

function restoreColWidths() {
  const saved = localStorage.getItem('colWidths_viewer');
  if (!saved) return;
  const widths = JSON.parse(saved);
  document.querySelectorAll('.table-header').forEach(header => {
    const spans = header.querySelectorAll(':scope > span');
    widths.forEach((w, i) => { if (spans[i]) spans[i].style.width = w; });
    const container = header.nextElementSibling;
    if (container) {
      container.querySelectorAll('.row').forEach(row => {
        const rowSpans = row.querySelectorAll(':scope > span');
        widths.forEach((w, i) => { if (rowSpans[i]) rowSpans[i].style.width = w; });
      });
    }
  });
}

document.addEventListener('mousedown', e => {
  if (!e.target.classList.contains('resize-handle')) return;
  const span = e.target.parentElement;
  const header = span.parentElement;
  const idx = Array.from(header.children).indexOf(span);
  colResize = { header, span, idx, startX: e.clientX, startW: span.offsetWidth };
  e.target.classList.add('active');
  document.body.classList.add('col-resizing');
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!colResize) return;
  const diff = e.clientX - colResize.startX;
  const newW = Math.max(40, colResize.startW + diff);
  colResize.span.style.width = newW + 'px';
  const container = colResize.header.nextElementSibling;
  if (container) {
    container.querySelectorAll('.row').forEach(row => {
      const spans = row.querySelectorAll(':scope > span');
      if (spans[colResize.idx]) spans[colResize.idx].style.width = newW + 'px';
    });
  }
});

document.addEventListener('mouseup', () => {
  if (colResize) {
    const h = colResize.span.querySelector('.resize-handle');
    if (h) h.classList.remove('active');
    document.body.classList.remove('col-resizing');
    const widths = [];
    colResize.header.querySelectorAll('span').forEach(s => widths.push(s.style.width || s.offsetWidth+'px'));
    localStorage.setItem('colWidths_viewer', JSON.stringify(widths));
    colResize = null;
  }
});

document.addEventListener('scroll', e => {
  const t = e.target;
  if (t.classList.contains('main-scroll')) {
    const hdr = t.previousElementSibling;
    if (hdr && hdr.classList.contains('table-header')) hdr.scrollLeft = t.scrollLeft;
  }
}, true);

// ── Sidebar Resize ────────────────────────────────────────────
(function(){
  const sidebar = document.querySelector('.sidebar');
  const handle = document.getElementById('sidebarResize');
  let sbResize = null;

  const savedW = localStorage.getItem('sidebarWidth_viewer');
  if (savedW) { const w = parseInt(savedW); if (w >= 140 && w <= 600) sidebar.style.width = w + 'px'; }

  handle.addEventListener('mousedown', e => {
    sbResize = { startX: e.clientX, startW: sidebar.offsetWidth };
    handle.classList.add('active');
    document.body.classList.add('sidebar-resizing');
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!sbResize) return;
    const diff = e.clientX - sbResize.startX;
    const newW = Math.max(140, Math.min(600, sbResize.startW + diff));
    sidebar.style.width = newW + 'px';
    localStorage.setItem('sidebarWidth_viewer', newW);
  });

  document.addEventListener('mouseup', () => {
    if (sbResize) {
      handle.classList.remove('active');
      document.body.classList.remove('sidebar-resizing');
      sbResize = null;
    }
  });
})();
