<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UltraClean Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   UltraClean Tracker v6.0 — Design System
   Warm Depth · Copper Accent · Layered Glass · Phosphor Icons
   ══════════════════════════════════════════════════════════════ */
:root {
  --bg-deep: #060609;
  --bg-base: #0a0a12;
  --bg-raised: #0f0f18;
  --bg-card: #12121e;
  --bg-card-hover: #181828;
  --bg-input: #0e0e1a;
  --border-subtle: rgba(255,255,255,0.04);
  --border-card: rgba(255,255,255,0.05);
  --border-hover: rgba(255,255,255,0.09);
  --sidebar: #08080f;
  --sidebar-hover: #131322;
  --sidebar-active: rgba(201,148,110,0.12);

  --accent: #c9946e;
  --accent-soft: rgba(201,148,110,0.18);
  --accent-glow: rgba(201,148,110,0.10);

  --text: #e8e8f0;
  --text-primary: #edeaf2;
  --text-secondary: #9494a8;
  --text-muted: #5c5c72;
  --text-dim: #434358;

  --danger: #e0556a;
  --danger-soft: rgba(224,85,106,0.12);
  --success: #4dab8e;
  --success-soft: rgba(77,171,142,0.12);
  --primary: #5b8cc9;
  --primary-soft: rgba(91,140,201,0.12);
  --purple: #8b6fbf;
  --warning: #d4a843;
  --info: #6ebccf;

  --radius-xs: 5px;
  --radius-sm: 8px;
  --radius: 11px;
  --radius-lg: 16px;
  --radius-xl: 20px;

  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
  --font-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", ui-monospace, monospace;

  --shadow-xs: 0 1px 2px rgba(2,2,10,0.5);
  --shadow-sm: 0 1px 4px rgba(2,2,12,0.6);
  --shadow-card: 0 2px 8px rgba(2,2,14,0.5), 0 0 0 1px var(--border-card);
  --shadow-card-hover: 0 4px 16px rgba(2,2,16,0.6), 0 0 0 1px var(--border-hover);
  --shadow-modal: 0 12px 40px rgba(2,2,14,0.7), 0 0 0 1px rgba(255,255,255,0.06);
  --shadow-button: 0 2px 8px rgba(2,2,12,0.4);

  --transition-fast: 130ms cubic-bezier(0.4,0,0.2,1);
  --transition-base: 200ms cubic-bezier(0.4,0,0.2,1);
  --transition-slow: 320ms cubic-bezier(0.4,0,0.2,1);
  --transition-spring: 350ms cubic-bezier(0.34,1.56,0.64,1);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:var(--font);
  background:var(--bg-base);
  color:var(--text);
  display:flex;
  min-height:100vh;
  scroll-behavior:smooth;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  letter-spacing:-0.01em;
}

/* Grain texture */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:9999;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
  opacity:.45
}

/* ═══════════════ SIDEBAR ═══════════════ */
.sidebar{
  width:240px;min-width:140px;flex-shrink:0;
  background:var(--sidebar);
  display:flex;flex-direction:column;
  padding:20px 0 14px;
  position:sticky;top:0;height:100vh;
  overflow-y:auto;overflow-x:hidden;
  border-right:1px solid rgba(255,255,255,0.03);
}
.sidebar-resize{
  width:4px;min-width:4px;cursor:col-resize;
  background:transparent;transition:background var(--transition-base);
  flex-shrink:0;position:relative;z-index:2;
}
.sidebar-resize::after{
  content:'';position:absolute;inset:0 -3px;
}
.sidebar-resize:hover,.sidebar-resize.active{background:var(--accent);opacity:.7}
body.sidebar-resizing{cursor:col-resize!important;user-select:none!important}

.sidebar .logo{padding:0 16px;margin-bottom:24px}
.sidebar .logo h1{font-size:14.5px;color:var(--accent);font-weight:700;letter-spacing:-0.025em}
.sidebar .logo span{font-size:10px;color:var(--text-muted);font-weight:500;display:block;margin-top:2px;letter-spacing:0.01em}

.sidebar .nav-title{
  font-size:9.5px;color:var(--text-dim);font-weight:600;
  padding:0 16px;margin-bottom:4px;margin-top:4px;
  text-transform:uppercase;letter-spacing:0.1em;
}
.sidebar .nav-btn{
  display:flex;align-items:center;gap:9px;
  width:calc(100% - 16px);
  text-align:left;padding:8px 12px;margin:1px 8px;
  border:none;background:transparent;color:var(--text-secondary);
  font-size:12.5px;font-family:var(--font);font-weight:500;
  border-radius:var(--radius-sm);
  cursor:pointer;transition:all var(--transition-fast);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:-0.01em;
}
.sidebar .nav-btn .nav-icon{font-size:16px;width:18px;text-align:center;flex-shrink:0;line-height:1;display:flex;align-items:center;justify-content:center}
.sidebar .nav-btn:hover{background:var(--sidebar-hover);color:var(--text)}
.sidebar .nav-btn.active{background:var(--sidebar-active);color:var(--accent);font-weight:600}

/* ═══════════════ MAIN AREA ═══════════════ */
.main{
  flex:1;display:flex;flex-direction:column;
  padding:0;height:100vh;overflow:hidden;min-width:0;
}
.main-content{padding:22px 28px;flex:1;display:flex;flex-direction:column;overflow:hidden}
.main-scroll{
  flex:1;overflow-y:auto;overflow-x:auto;
  min-height:0;scroll-behavior:smooth;
  border-radius:var(--radius);
}
.main-scroll::-webkit-scrollbar,
.scroll::-webkit-scrollbar{width:5px;height:5px}
.main-scroll::-webkit-scrollbar-track,
.scroll::-webkit-scrollbar-track{background:transparent}
.main-scroll::-webkit-scrollbar-thumb,
.scroll::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,0.04);border-radius:3px;
}
.main-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.08)}

/* ═══════════════ TOOLBAR ═══════════════ */
.toolbar{
  display:flex;align-items:center;gap:7px;
  flex-wrap:wrap;margin-bottom:16px;
}
.toolbar h2{
  font-size:18px;font-weight:700;
  margin-right:auto;color:var(--text-primary);
  letter-spacing:-0.025em;
}

/* ═══════════════ BUTTONS ═══════════════ */
.btn{
  padding:7px 14px;border:none;border-radius:var(--radius-xs);
  font-size:12px;cursor:pointer;font-weight:600;
  font-family:var(--font);letter-spacing:-0.01em;
  transition:all var(--transition-fast);
  white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;
  position:relative;
}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);box-shadow:var(--shadow-button)}
.btn:active{transform:scale(.97) translateY(0)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:var(--radius-xs)}
.btn-sm{padding:5px 10px;font-size:11px;border-radius:4px}

.btn-primary{background:var(--primary);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-gray{background:rgba(255,255,255,0.06);color:var(--text-secondary)}
.btn-gray:hover{background:rgba(255,255,255,0.10);color:var(--text)}
.btn-accent{background:var(--accent);color:#14100c;font-weight:700;box-shadow:0 2px 12px rgba(201,148,110,0.18)}
.btn-accent:hover{filter:brightness(1.06);box-shadow:0 4px 16px rgba(201,148,110,0.25)}
.btn-outline{
  background:transparent;
  border:1px solid rgba(255,255,255,0.07);
  color:var(--text-secondary);
}
.btn-outline:hover{background:rgba(255,255,255,0.03);color:var(--text);border-color:rgba(255,255,255,0.12)}

/* ═══════════════ INPUTS ═══════════════ */
input,select,textarea{
  background:var(--bg-input);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:var(--radius-xs);
  color:var(--text);padding:7px 10px;
  font-size:12px;font-family:var(--font);
  outline:none;transition:border-color var(--transition-fast),box-shadow var(--transition-fast);
}
input:focus,select:focus,textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}
select{
  min-width:120px;cursor:pointer;color-scheme:dark;
  appearance:none;
  background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%239494a8'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 10px center;
  padding-right:28px;
}
select option{background:var(--bg-raised);color:var(--text)}

/* ═══════════════ TABLE HEADER ═══════════════ */
.table-header{
  display:flex;background:var(--bg-card);
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;
  padding:0;font-size:11px;font-weight:600;
  color:var(--text-dim);overflow:hidden;
  border:1px solid var(--border-card);
  border-bottom:none;
  letter-spacing:0.02em;
}
.table-header span{padding:9px 5px;cursor:pointer;user-select:none;position:relative}
.table-header span:hover{background:rgba(255,255,255,0.02);color:var(--text-secondary)}
.table-header span .sort-arrow{color:var(--accent);font-size:9px;margin-left:2px}
.resize-handle{
  position:absolute;right:0;top:0;bottom:0;
  width:5px;cursor:col-resize;z-index:5;transition:background var(--transition-fast);
}
.resize-handle:hover,.resize-handle.active{background:var(--accent);opacity:.5}
.table-header span:last-child .resize-handle{display:none}
body.col-resizing{cursor:col-resize!important;user-select:none!important}
body.col-resizing .table-header span{cursor:col-resize!important}

/* ═══════════════ DATA ROWS ═══════════════ */
.row{
  display:flex;align-items:center;
  background:var(--bg-card);
  border-radius:0;margin:0;padding:6px 0;
  font-size:12px;transition:all var(--transition-fast);
  border-bottom:1px solid rgba(255,255,255,0.018);
}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg-card-hover)}
.row:nth-child(even){background:rgba(255,255,255,0.008)}
.row:nth-child(even):hover{background:var(--bg-card-hover)}
.row span,.row .cell{
  padding:5px 5px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;line-height:1.4;
}
.row input[type="checkbox"]{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

/* ═══════════════ CARDS ═══════════════ */
.card{
  background:var(--bg-card);border-radius:var(--radius);
  padding:20px 22px;
  border:1px solid var(--border-card);
  box-shadow:var(--shadow-card);
  transition:all var(--transition-base);
}
.card:hover{border-color:rgba(255,255,255,0.07);box-shadow:var(--shadow-card-hover)}

.card-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;
}

.status-card{
  display:flex;align-items:center;gap:10px;
  padding:12px 14px;
  background:var(--bg-card);
  border-radius:var(--radius-sm);
  border:1px solid var(--border-card);
  transition:all var(--transition-fast);
}
.status-card:hover{background:var(--bg-card-hover);border-color:var(--border-hover)}
.status-card .status-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.status-card .count{font-size:19px;font-weight:700;margin-left:auto;font-variant-numeric:tabular-nums;letter-spacing:-0.02em}

/* ═══════════════ BADGES & TAGS ═══════════════ */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 10px;border-radius:var(--radius-xs);
  font-size:10.5px;font-weight:600;letter-spacing:-0.01em;
}
.status-tag{
  padding:3px 10px;border-radius:var(--radius-xs);
  font-size:10.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px;
  letter-spacing:-0.01em;
}
.status-tag .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;box-shadow:0 0 5px currentColor}

/* ═══════════════ PAGING ═══════════════ */
.paging{
  display:flex;align-items:center;gap:8px;
  font-size:11.5px;color:var(--text-muted);
  margin-top:10px;padding:4px 0;
}

/* ═══════════════ MODAL ═══════════════ */
.modal-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(4,4,12,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
  z-index:100;animation:fadeIn var(--transition-fast);
}
.modal{
  background:var(--bg-card);border-radius:var(--radius-lg);
  padding:28px 30px;width:92%;max-width:500px;
  max-height:85vh;overflow-y:auto;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:var(--shadow-modal);
  animation:slideUp var(--transition-slow);
}
.modal h3{margin-bottom:18px;font-size:16px;font-weight:700;letter-spacing:-0.02em;color:var(--text-primary)}
.modal .field{margin-bottom:15px}
.modal .field label{display:block;font-size:11px;color:var(--text-muted);font-weight:600;margin-bottom:5px;letter-spacing:0.03em}
.modal .field input,.modal .field select,.modal .field textarea{width:100%}
.modal .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ═══════════════ TOAST ═══════════════ */
.toast{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
  background:var(--bg-card);color:var(--text-primary);
  padding:10px 24px;border-radius:24px;
  font-size:12px;font-weight:500;letter-spacing:-0.01em;
  z-index:200;
  border:1px solid rgba(255,255,255,0.06);
  box-shadow:0 6px 24px rgba(2,2,14,0.6);
  animation:toastIn .3s cubic-bezier(0.4,0,0.2,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ═══════════════ CHART WRAP ═══════════════ */
.chart-wrap{
  background:var(--bg-card);border-radius:var(--radius);
  padding:22px;margin-bottom:14px;
  border:1px solid var(--border-card);
}
canvas{max-width:100%}

/* ═══════════════ UTILITY ═══════════════ */
.check-row{
  display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;margin:8px 0;padding:4px 0;
}
.empty{
  text-align:center;color:var(--text-muted);
  padding:56px 20px;font-size:13px;
}
.bar-outer{
  flex:1;background:var(--bg-raised);
  border-radius:4px;height:16px;overflow:hidden;
  min-width:100px;border:1px solid rgba(255,255,255,0.025);
}
.bar-inner{
  height:100%;background:var(--success);
  border-radius:4px;transition:width var(--transition-slow);
}
.tab-bar{display:flex;gap:4px;margin-bottom:14px}

.report-box{
  background:var(--bg-card);border:1px solid var(--border-card);
  border-radius:var(--radius);padding:24px 28px;
  font-family:var(--font-mono);
  font-size:12.5px;white-space:pre-wrap;line-height:1.7;
  flex:1;overflow-y:auto;min-height:0;color:var(--text-secondary);
}

.progress-row{
  display:flex;align-items:center;gap:10px;
  margin:5px 0;font-size:12px;
}
.progress-row .lbl{width:130px;min-width:130px;font-weight:500}

.scroll{overflow-y:auto;flex:1;min-height:0}

/* ═══════════════ SKELETON LOADING ═══════════════ */
.skeleton{
  background:linear-gradient(90deg,var(--bg-card) 25%,var(--bg-card-hover) 50%,var(--bg-card) 75%);
  background-size:200% 100%;
  animation:skeleton-pulse 1.4s ease-in-out infinite;
  border-radius:var(--radius-xs);
}
.skeleton-text{height:13px;width:100%;margin-bottom:8px}
.skeleton-text.short{width:60%}
.skeleton-row{height:38px;margin:2px 0;border-radius:var(--radius-sm)}
@keyframes skeleton-pulse{
  0%{background-position:200% 0}
  100%{background-position:-200% 0}
}

/* ═══════════════ HERO KPI CARDS (dashboard) ═══════════════ */
.dash-overview{
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr .8fr;
  gap:12px;margin-bottom:24px;
}
.dash-overview .dash-card{
  background:var(--bg-card);
  border:1px solid var(--border-card);
  border-radius:var(--radius);
  padding:20px 22px;
  transition:all var(--transition-base);
  position:relative;overflow:hidden;
}
.dash-overview .dash-card:hover{border-color:rgba(255,255,255,0.07);transform:translateY(-2px);box-shadow:var(--shadow-card-hover)}
.dash-overview .dash-card:first-child{border-left:3px solid var(--accent)}
.dash-overview .dash-card .dash-icon{font-size:22px;margin-bottom:8px;opacity:.85}
.dash-overview .dash-card .dash-label{font-size:10.5px;color:var(--text-dim);font-weight:600;letter-spacing:0.05em;margin-bottom:6px}
.dash-overview .dash-card .dash-val{font-size:36px;font-weight:700;letter-spacing:-0.035em;font-variant-numeric:tabular-nums}

@media(max-width:900px){
  .dash-overview{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:500px){
  .dash-overview{grid-template-columns:1fr}
}

/* ═══════════════ RESPONSIVE ═══════════════ */
@media(max-width:768px){
  body{flex-direction:column}
  .sidebar{width:100%;min-width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;padding:8px;gap:2px;border-right:none;border-bottom:1px solid rgba(255,255,255,0.03)}
  .sidebar .logo,.sidebar .nav-title{display:none}
  .sidebar .nav-btn{width:auto;margin:1px;padding:6px 10px;font-size:11px}
  .sidebar .nav-btn .nav-icon{font-size:14px}
  .main-content{padding:14px}
  .table-header span,.row span{font-size:10px}
  .card-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .sidebar-resize{display:none}
}

/* ═══════════════ PRINT ═══════════════ */
@media print{
  body{background:#fff;color:#000}
  .sidebar{display:none}
  .toolbar .btn{display:none}
  .row{break-inside:avoid}
}
</style>
</head>
<body>

<!-- ═══════════════ SIDEBAR ═══════════════ -->
<nav class="sidebar">
  <div class="logo"><h1>Ultra Cleaning</h1><span>Video Workflow v6.0</span></div>
  <div class="nav-title">Navigation</div>
  <button class="nav-btn active" data-page="projects"><span class="nav-icon"><i class="ph ph-film-slate"></i></span> Projects</button>
  <button class="nav-btn" data-page="materials"><span class="nav-icon"><i class="ph ph-files"></i></span> Materials</button>
  <button class="nav-btn" data-page="daily"><span class="nav-icon"><i class="ph ph-calendar-blank"></i></span> Daily Report</button>
  <button class="nav-btn" data-page="weekly"><span class="nav-icon"><i class="ph ph-calendar"></i></span> Weekly Report</button>
  <button class="nav-btn" data-page="dashboard"><span class="nav-icon"><i class="ph ph-chart-pie"></i></span> Overview</button>
  <button class="nav-btn" data-page="stats"><span class="nav-icon"><i class="ph ph-chart-bar"></i></span> Analytics</button>
  <button class="nav-btn" data-page="trash"><span class="nav-icon"><i class="ph ph-trash"></i></span> Trash</button>
</nav>
<div class="sidebar-resize" id="sidebarResize"></div>

<!-- ═══════════════ MAIN ═══════════════ -->
<div class="main">
  <div class="main-content" id="main"></div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────
const API_BASE = 'https://wood0807.pythonanywhere.com';

const STATUSES = ["素材歸檔","已停止","剪輯中","MKT審核中","MKT退回","老闆審核中","老闆退回","審核通過","文案撰寫中","準備排程","已排程","已發布"];
const STATUS_COLORS = {"素材歸檔":"#7a7a88","已停止":"#c46a8a","剪輯中":"#d4956b","MKT審核中":"#5b8cc9","MKT退回":"#e0556a","老闆審核中":"#8b6fbf","老闆退回":"#c43b50","審核通過":"#3d9478","文案撰寫中":"#4dab8e","準備排程":"#d4a843","已排程":"#6ebccf","已發布":"#2d7a5f"};

let CATEGORIES = {};
let ALL_CATEGORY_LABELS = [];

async function loadConfig() {
  try {
    const r = await fetch(`${API_BASE}/api/config`);
    const d = await r.json();
    CATEGORIES = d.categories || {};
    ALL_CATEGORY_LABELS = d.category_labels || [];
  } catch(e) { /* use defaults */ }
}
loadConfig();

// ── Navigation ────────────────────────────────────────────────
document.querySelectorAll('.nav-btn').forEach(b => {
  b.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    loadPage(b.dataset.page);
  };
});

// ── Toast ─────────────────────────────────────────────────────
function toast(msg) {
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2500);
}

// ── Skeleton loading ──────────────────────────────────────────
function showSkeleton(rowCount) {
  r = rowCount || 8;
  let h = '';
  for(let i=0;i<r;i++) h += '<div class="skeleton skeleton-row"></div>';
  return h;
}

// ── API helpers ───────────────────────────────────────────────
async function api(url, opts={}) {
  const res = await fetch(`${API_BASE}${url}`, {
    headers: {'Content-Type':'application/json'},
    ...opts
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error||'Request failed'); }
  return res;
}

// ── Page loader ───────────────────────────────────────────────
async function loadPage(page) {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty" style="padding-top:80px">Loading...</div>';
  try {
    switch(page) {
      case 'projects': await renderProjects(); break;
      case 'materials': await renderMaterials(); break;
      case 'daily': await renderDaily(); break;
      case 'weekly': await renderWeekly(); break;
      case 'dashboard': await renderDashboard(); break;
      case 'stats': await renderStats(); break;
      case 'trash': await renderTrash(); break;
    }
  } catch(e) { main.innerHTML = `<div class="empty" style="color:var(--danger);padding-top:80px">Error: ${e.message}</div>`; }
}

// ── Projects Page ─────────────────────────────────────────────
let projState = {sortCol:'id',sortAsc:false,page:0,status:'',category:'',search:'',selected:new Set(),total:0};
let lastClickedPid = null;

async function renderProjects() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h2>Projects</h2>
      <input id="projSearch" placeholder="Search name..." style="width:180px" oninput="projState.search=this.value;projState.page=0;renderProjects()">
      <select id="projStatusFilter" onchange="projState.status=this.value;projState.page=0;renderProjects()">
        <option value="">All Status</option>${STATUSES.map(s=>`<option>${s}</option>`).join('')}
      </select>
      <select id="projCatFilter" onchange="projState.category=this.value;projState.page=0;renderProjects()">
        <option value="">All Categories</option>${ALL_CATEGORY_LABELS.map(l=>`<option>${l}</option>`).join('')}
      </select>
      <button class="btn btn-accent" onclick="showAddModal()"><i class="ph ph-plus"></i> New Project</button>
      <button class="btn btn-purple" onclick="exportDB()"><i class="ph ph-download-simple"></i> Export</button>
      <button class="btn btn-primary" onclick="showImportDialog()"><i class="ph ph-upload-simple"></i> Import</button>
    </div>
    <div class="table-header">
      <span style="width:50px" onclick="toggleSort('id')">ID <span class="sort-arrow">${sortArrow('id')}</span></span>
      <span style="width:280px" onclick="toggleSort('name')">Name <span class="sort-arrow">${sortArrow('name')}</span></span>
      <span style="width:90px" onclick="toggleSort('category')">Category <span class="sort-arrow">${sortArrow('category')}</span></span>
      <span style="width:105px" onclick="toggleSort('current_status')">Status <span class="sort-arrow">${sortArrow('current_status')}</span></span>
      <span style="width:120px">Note</span>
      <span style="width:90px" onclick="toggleSort('edit_date')">Edit Date <span class="sort-arrow">${sortArrow('edit_date')}</span></span>
      <span style="width:90px" onclick="toggleSort('review_date')">Review Date <span class="sort-arrow">${sortArrow('review_date')}</span></span>
      <span style="width:90px" onclick="toggleSort('publish_date')">Publish Date <span class="sort-arrow">${sortArrow('publish_date')}</span></span>
      <span style="width:115px" onclick="toggleSort('updated_at')">Updated <span class="sort-arrow">${sortArrow('updated_at')}</span></span>
      <span style="width:160px"></span>
    </div>
    <div class="main-scroll"><div class="scroll" id="projList">${showSkeleton(10)}</div></div>
    <div id="projBatch" class="check-row" style="display:none"></div>

  `;
  projState.selected.clear();

  injectResizeHandles();
  restoreColWidths();

function sortArrow(col) { return projState.sortCol===col ? (projState.sortAsc?'&#9650;':'&#9660;') : ''; }
function toggleSort(col) {
  if(projState.sortCol===col) projState.sortAsc=!projState.sortAsc; else {projState.sortCol=col;projState.sortAsc=true;}
  projState.page=0; renderProjects();
}

async function loadProjects() {
  const p = projState;
  const params = new URLSearchParams({
    sort_col:p.sortCol, sort_asc:p.sortAsc, page:p.page, limit:200,
    status:p.status, category:p.category, search:p.search
  });
  const res = await api(`/api/projects?${params}`);
  const data = await res.json();
  p.total = data.total;
  renderProjectRows(data.projects);
  renderPaging(data.total, data.projects.length);
  renderBatchOps(data.projects);
}

function renderProjectRows(projects) {
  const list = document.getElementById('projList');
  if(!projects.length) { list.innerHTML='<div class="empty">No projects yet<br><br><button class="btn btn-accent" onclick="showAddModal()"><i class="ph ph-plus"></i> Create first project</button></div>'; return; }
  list.innerHTML = projects.map(r => {
    const cat = CATEGORIES[r.category] || r.category;
    const updated = (r.updated_at||'').substring(0,10);
    const editD = (r.edit_date||'').substring(0,10)||'Not set';
    const revD = (r.review_date||'').substring(0,10)||'Not set';
    const pubD = (r.publish_date||'').substring(0,10)||'Not set';
    return `<div class="row" data-id="${r.id}">
      <span style="width:50px"><input type="checkbox" data-pid="${r.id}" onclick="handleCheckClick(event,${r.id})" onchange="toggleSelect(${r.id},this.checked)"> ${r.id}</span>
      <span style="width:280px" title="${r.name}">${r.name}</span>
      <span style="width:90px">${cat}</span>
      <span style="width:105px">
        <select style="font-size:11px;padding:3px 6px;background:var(--bg-input);border:1px solid rgba(255,255,255,0.05);color:var(--text);border-radius:var(--radius-xs);cursor:pointer;max-width:100px;font-family:var(--font)" 
          onchange="quickUpdateStatus(${r.id},this.value,this.dataset.current)" 
          data-current="${r.current_status}">
          ${STATUSES.map(s=>`<option value="${s}" ${s===r.current_status?'selected':''}>${s}</option>`).join('')}
        </select>
      </span>
      <span style="width:120px;color:var(--text-muted)">${(r.note||'').substring(0,18)}</span>
      <span style="width:90px;color:${editD!=='Not set'?'#9ec5fe':'var(--text-muted)'};cursor:pointer;font-weight:${editD!=='Not set'?'500':'400'}" onclick="showEditDateModal(${r.id},'edit_date','${r.edit_date||''}')">${editD}</span>
      <span style="width:90px;color:${revD!=='Not set'?'var(--warning)':'var(--text-muted)'};cursor:pointer;font-weight:${revD!=='Not set'?'500':'400'}" onclick="showEditDateModal(${r.id},'review_date','${r.review_date||''}')">${revD}</span>
      <span style="width:90px;color:${pubD!=='Not set'?'#20c997':'var(--text-muted)'};cursor:pointer;font-weight:${pubD!=='Not set'?'500':'400'}" onclick="showEditDateModal(${r.id},'publish_date','${r.publish_date||''}')">${pubD}</span>
      <span style="width:115px;color:var(--text-muted);cursor:pointer;font-weight:400" onclick="showEditTimeModal(${r.id},'${r.updated_at||''}')">${updated}</span>
      <span style="width:160px;display:flex;gap:4px">
        <button class="btn btn-sm btn-primary" onclick="showStatusModal(${r.id},'${r.current_status}')">Status</button>
        <button class="btn btn-sm btn-gray" onclick="showEditModal(${r.id},'${r.name}','${(r.note||'').replace(/'/g,"\\'")}')">Edit</button>
        <button class="btn btn-sm btn-purple" onclick="showDetailModal(${r.id})">Detail</button>
      </span>
    </div>`;
  }).join('');
}

function toggleSelect(pid, checked) {
  lastClickedPid = pid;
  if(checked) projState.selected.add(pid); else projState.selected.delete(pid);
  updateBatchUI();
}

function handleCheckClick(e, pid) {
  if(e.shiftKey && lastClickedPid !== null && lastClickedPid !== pid) {
    e.preventDefault();
    rangeSelect(lastClickedPid, pid);
    return false;
  }
  lastClickedPid = pid;
}

function rangeSelect(from, to) {
  const cbs = document.querySelectorAll('#projList input[type="checkbox"]');
  const pids = [...cbs].map(cb => parseInt(cb.dataset.pid));
  const fromIdx = pids.indexOf(from);
  const toIdx = pids.indexOf(to);
  if(fromIdx === -1 || toIdx === -1) return;
  const [lo, hi] = fromIdx < toIdx ? [fromIdx, toIdx] : [toIdx, fromIdx];
  for(let i = lo; i <= hi; i++) {
    const cb = cbs[i];
    cb.checked = true;
    projState.selected.add(pids[i]);
  }
  lastClickedPid = to;
  updateBatchUI();
}

function renderBatchOps(projects) {
  const el = document.getElementById('projBatch');
  if(!projects.length){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `
    <label style="font-size:12px;cursor:pointer"><input type="checkbox" id="selectAll" onchange="toggleAll(this.checked)"> Select All</label>
    <span style="color:var(--text-muted);font-size:11.5px;margin-left:8px">Batch Status:</span>
    <select id="batchStatus" style="width:130px">${STATUSES.map(s=>`<option>${s}</option>`).join('')}</select>
    <button class="btn btn-sm btn-accent" onclick="batchUpdateStatus()">Apply</button>
    <span style="color:var(--text-muted);font-size:11.5px;margin-left:10px">Edit:</span>
    <input id="batchEditDate" placeholder="YYYY-MM-DD" style="width:105px">
    <button class="btn btn-sm btn-outline" onclick="batchUpdateDate('edit_date')">Apply</button>
    <span style="color:var(--text-muted);font-size:11.5px;margin-left:10px">Review:</span>
    <input id="batchReviewDate" placeholder="YYYY-MM-DD" style="width:105px">
    <button class="btn btn-sm btn-outline" onclick="batchUpdateDate('review_date')">Apply</button>
    <span style="color:var(--text-muted);font-size:11.5px;margin-left:10px">Publish:</span>
    <input id="batchPublishDate" placeholder="YYYY-MM-DD" style="width:105px">
    <button class="btn btn-sm btn-outline" onclick="batchUpdateDate('publish_date')">Apply</button>
    <button class="btn btn-sm btn-danger" style="margin-left:auto" onclick="batchDelete()"><i class="ph ph-trash"></i> Delete Selected</button>
  `;
}

function toggleAll(checked) {
  document.querySelectorAll('#projList input[type="checkbox"]').forEach(cb => {
    cb.checked = checked;
    const pid = parseInt(cb.dataset.pid);
    if(checked) projState.selected.add(pid); else projState.selected.delete(pid);
  });
}

function updateBatchUI() {
  const sa = document.getElementById('selectAll');
  if(sa) sa.checked = projState.selected.size > 0 && projState.selected.size === document.querySelectorAll('#projList input[type="checkbox"]').length;
}

function getSelectedIds() { return [...projState.selected]; }

async function batchUpdateStatus() {
  const ids = getSelectedIds(); if(!ids.length) return toast('No projects selected');
  const st = document.getElementById('batchStatus').value;
  await api('/api/projects/batch/status', {method:'POST',body:JSON.stringify({ids,status:st})});
  toast(`Updated ${ids.length} projects to "${st}"`);
  projState.selected.clear(); renderProjects();
}

async function batchUpdateDate(field) {
  const ids = getSelectedIds(); if(!ids.length) return toast('No projects selected');
  const elId = field==='edit_date'?'batchEditDate':field==='review_date'?'batchReviewDate':field==='publish_date'?'batchPublishDate':'batchUpdateDate';
  const dateVal = document.getElementById(elId).value.trim();
  await api(`/api/projects/batch/date/${field}`, {method:'POST',body:JSON.stringify({ids,date:dateVal||null})});
  toast(`Updated dates for ${ids.length} projects`);
  projState.selected.clear(); renderProjects();
}

async function batchDelete() {
  const ids = getSelectedIds(); if(!ids.length) return toast('No projects selected');
  if(!confirm(`Move ${ids.length} projects to trash?`)) return;
  await api('/api/projects/batch/delete', {method:'POST',body:JSON.stringify({ids})});
  toast(`Moved ${ids.length} projects to trash`);
  projState.selected.clear(); renderProjects();
}

function renderPaging(total, current) {
  const totalPages = Math.max(1, Math.ceil(total/200));
  const page = projState.page + 1;
  let html = `Showing ${current} / ${total} &emsp; Page ${page}/${totalPages} `;
  if(page>1) html += `<button class="btn btn-sm btn-gray" onclick="projState.page--;renderProjects()">Previous</button>`;
  if(page<totalPages) html += `<button class="btn btn-sm btn-gray" onclick="projState.page++;renderProjects()">Next</button>`;
  document.getElementById('projPaging').innerHTML = html;
}

// ── Materials Page ─────────────────────────────────────────────
let matState = {sortCol:'id',sortAsc:false,page:0,category:'',search:'',selected:new Set(),total:0};
let matLastClickedId = null;
const MAT_PAGE_SIZE = 50;

async function renderMaterials() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h2>Materials</h2>
      <input id="matSearch" placeholder="Search name..." style="width:180px" oninput="matState.search=this.value;matState.page=0;renderMaterials()">
      <select id="matCatFilter" onchange="matState.category=this.value;matState.page=0;renderMaterials()">

function matSortArrow(col) { return matState.sortCol===col ? (matState.sortAsc?'&#9650;':'&#9660;') : ''; }
function matToggleSort(col) {
  if(matState.sortCol===col) matState.sortAsc=!matState.sortAsc; else {matState.sortCol=col;matState.sortAsc=true;}
  matState.page=0; renderMaterials();
}

async function loadMaterials() {
  const s = matState;
  const params = new URLSearchParams({
    sort_col:s.sortCol, sort_asc:s.sortAsc, page:s.page, limit:MAT_PAGE_SIZE,
    category:s.category, search:s.search
  });
  const res = await api(`/api/materials?${params}`);
  const data = await res.json();
  s.total = data.total;
  renderMaterialRows(data.materials);
  matRenderPaging(data.total, data.materials.length);
  matRenderBatchOps(data.materials);
}

function renderMaterialRows(materials) {
  const list = document.getElementById('matList');
  if(!materials.length) { list.innerHTML='<div class="empty">No materials yet<br><br><button class="btn btn-accent" onclick="showMatAddModal()"><i class="ph ph-plus"></i> Create first material</button></div>'; return; }
  list.innerHTML = materials.map(m => {
    const cat = CATEGORIES[m.category] || m.category;
    const created = (m.created_at||'').substring(0,10);
    const updated = (m.updated_at||'').substring(0,10);
    const notePreview = (m.note||'').substring(0,24);
    return `<div class="row" data-mid="${m.id}">
      <span style="width:50px"><input type="checkbox" data-mid="${m.id}" onclick="matHandleCheckClick(event,${m.id})" onchange="matToggleSelect(${m.id},this.checked)"> ${m.id}</span>
      <span style="width:290px" title="${m.name}">${m.name}</span>
      <span style="width:120px">${cat}</span>
      <span style="width:180px;color:var(--text-muted)" title="${(m.note||'').replace(/"/g,'&quot;')}">${notePreview}</span>
      <span style="width:135px;color:var(--text-muted)">${created}</span>
      <span style="width:135px;color:var(--text-muted)">${updated}</span>
      <span style="width:240px;display:flex;gap:4px">
        <button class="btn btn-sm btn-gray" onclick="showMatEditModal(${m.id},'${(m.name||'').replace(/'/g,"\\'")}','${(m.category||'').replace(/'/g,"\\'")}','${(m.note||'').replace(/'/g,"\\'").replace(/\n/g,'\\n')}')">Edit</button>
        <button class="btn btn-sm btn-danger" onclick="deleteMaterial(${m.id})">Delete</button>
        <button class="btn btn-sm btn-accent" onclick="startEditMaterial(${m.id})">Start Edit</button>
      </span>
    </div>`;
  }).join('');
}

function matToggleSelect(mid, checked) {
  matLastClickedId = mid;
  if(checked) matState.selected.add(mid); else matState.selected.delete(mid);
  matUpdateBatchUI();
}

function matHandleCheckClick(e, mid) {
  if(e.shiftKey && matLastClickedId !== null && matLastClickedId !== mid) {
    e.preventDefault();
    matRangeSelect(matLastClickedId, mid);
    return false;
  }
  matLastClickedId = mid;
}

function matRangeSelect(from, to) {
  const cbs = document.querySelectorAll('#matList input[type="checkbox"]');
  const mids = [...cbs].map(cb => parseInt(cb.dataset.mid));
  const fromIdx = mids.indexOf(from);
  const toIdx = mids.indexOf(to);
  if(fromIdx === -1 || toIdx === -1) return;
  const [lo, hi] = fromIdx < toIdx ? [fromIdx, toIdx] : [toIdx, fromIdx];
  for(let i = lo; i <= hi; i++) {
    const cb = cbs[i];
    cb.checked = true;
    matState.selected.add(mids[i]);
  }
  matLastClickedId = to;
  matUpdateBatchUI();
}

function matRenderBatchOps(materials) {
  const el = document.getElementById('matBatch');
  if(!materials.length){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = `
    <label style="font-size:12px;cursor:pointer"><input type="checkbox" id="matSelectAll" onchange="matToggleAll(this.checked)"> Select All</label>
    <button class="btn btn-sm btn-danger" style="margin-left:10px" onclick="matBatchDelete()"><i class="ph ph-trash"></i> Batch Delete</button>
  `;
}

function matToggleAll(checked) {
  document.querySelectorAll('#matList input[type="checkbox"]').forEach(cb => {
    cb.checked = checked;
    const mid = parseInt(cb.dataset.mid);
    if(checked) matState.selected.add(mid); else matState.selected.delete(mid);
  });
}

function matUpdateBatchUI() {
  const sa = document.getElementById('matSelectAll');
  if(sa) sa.checked = matState.selected.size > 0 && matState.selected.size === document.querySelectorAll('#matList input[type="checkbox"]').length;
}

function matGetSelectedIds() { return [...matState.selected]; }

async function matBatchDelete() {
  const ids = matGetSelectedIds(); if(!ids.length) return toast('No materials selected');
  if(!confirm(`Delete ${ids.length} materials?`)) return;
  let success = 0, fail = 0;
  for(const id of ids) {
    try { await api(`/api/materials/${id}`, {method:'DELETE'}); success++; }
    catch(e) { fail++; }
  }
  toast(`Deleted ${success} materials${fail>0?`, ${fail} failed`:''}`);
  matState.selected.clear(); renderMaterials();
}

function matRenderPaging(total, current) {
  const totalPages = Math.max(1, Math.ceil(total/MAT_PAGE_SIZE));
  const page = matState.page + 1;
  let html = `Showing ${current} / ${total} &emsp; Page ${page}/${totalPages} `;
  if(page>1) html += `<button class="btn btn-sm btn-gray" onclick="matState.page--;renderMaterials()">Previous</button>`;
  if(page<totalPages) html += `<button class="btn btn-sm btn-gray" onclick="matState.page++;renderMaterials()">Next</button>`;
  document.getElementById('matPaging').innerHTML = html;
}

// ── Material Modals ───────────────────────────────────────────
function showMatAddModal() {
  showModal('New Material', `
    <div class="field"><label>Material Name</label><input id="matName" placeholder="e.g. Termite case raw footage"></div>
    <div class="field"><label>Category</label><select id="matCat">${ALL_CATEGORY_LABELS.map(l=>`<option>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Note</label><textarea id="matNote" rows="3" placeholder="Material description, source, etc."></textarea></div>
  `, async (ov) => {
    const name = ov.querySelector('#matName').value.trim();
    if(!name) return;
    const catMap = {}; for(const [k,v] of Object.entries(CATEGORIES)) catMap[v]=k;
    const category = catMap[ov.querySelector('#matCat').value] || 'pest_care';
    const note = ov.querySelector('#matNote').value.trim();
    await api('/api/materials', {method:'POST',body:JSON.stringify({name,category,note})});
    ov.remove(); toast(`Added: ${name}`); renderMaterials();
  });
}

function showMatBatchAddModal() {
  showModal('Batch Add Materials', `
    <div class="field"><label>Category</label><select id="matBatchCat">${ALL_CATEGORY_LABELS.map(l=>`<option>${l}</option>`).join('')}</select></div>
    <div class="field"><label>Count</label><input type="number" id="matBatchCount" value="5" min="1" max="50" style="width:100px"></div>
    <div class="field"><label>Base Name (auto-numbered if empty)</label><input id="matBatchName" placeholder="e.g. Termite case material"></div>
    <div class="field"><label>Note (applied to all)</label><textarea id="matBatchNote" rows="2" placeholder="Optional"></textarea></div>
  `, async (ov) => {
    const catMap = {}; for(const [k,v] of Object.entries(CATEGORIES)) catMap[v]=k;
    const category = catMap[ov.querySelector('#matBatchCat').value] || 'pest_care';
    const count = parseInt(ov.querySelector('#matBatchCount').value) || 5;
    const baseName = ov.querySelector('#matBatchName').value.trim() || 'Unnamed Material';
    const note = ov.querySelector('#matBatchNote').value.trim();
    ov.remove();
    toast(`Adding ${count} materials...`);
    let success = 0, fail = 0;
    for(let i = 1; i <= count; i++) {
      const name = `${baseName}_${String(i).padStart(2,'0')}`;
      try {
        await api('/api/materials', {method:'POST',body:JSON.stringify({name,category,note})});
        success++;
      } catch(e) { fail++; }
    }
    toast(`Added ${success} materials${fail>0?`, ${fail} failed`:''}`);
    renderMaterials();
  });
}

function showModal(title, bodyHtml, onSave) {
  const overlay = document.createElement('div'); overlay.className='modal-overlay';
  overlay.innerHTML = `<div class="modal"><h3>${title}</h3>${bodyHtml}<div class="btn-row">
    <button class="btn btn-gray" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
    <button class="btn btn-accent" id="modalSave">Confirm</button>
  </div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#modalSave').onclick = () => { onSave(overlay); };
  overlay.onclick = e => { if(e.target===overlay) overlay.remove(); };
}

// ── Import / Export ───────────────────────────────────────────
function showImportDialog() {
  const input = document.createElement('input'); input.type='file'; input.accept='.db,.sqlite,.sqlite3,.csv';
  input.onchange = async () => {
    const file = input.files[0]; if(!file) return;
    toast('Importing, please wait...');
    const fd = new FormData(); fd.append('file', file);
    try {
      const res = await fetch(`${API_BASE}/api/import`, {method:'POST',body:fd});
      const d = await res.json();
      if(res.ok) toast(`Import complete! Added ${d.imported}, skipped ${d.skipped||0}`);
      else toast(`Import failed: ${d.error}`);
      renderProjects();
    } catch(e) { toast(`Import failed: ${e.message}`); }
  };
  input.click();
}

        <span style="font-weight:600;font-variant-numeric:tabular-nums">${c.count}</span>
      </div>
    `).join('')}</div>`:''}
    </div>
  `;
}

// ── Stats / Report Center ─────────────────────────────────────
let statsState = {period:'monthly',idx:0};

async function renderStats() {
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="toolbar"><h2>Analytics</h2></div>
    <div class="tab-bar" id="periodTabs">
      ${['daily','weekly','monthly','quarterly','yearly'].map(p=>`
        <button class="btn btn-sm ${statsState.period===p?'btn-accent':'btn-outline'}" data-period="${p}" onclick="switchPeriod('${p}')">${{daily:'Daily',weekly:'Weekly',monthly:'Monthly',quarterly:'Quarterly',yearly:'Yearly'}[p]}</button>
      `).join('')}
    </div>
    <div class="toolbar">
      <button class="btn btn-sm btn-gray" onclick="statsState.idx--;renderStats()"><i class="ph ph-caret-left"></i></button>
      <span id="statsLabel" style="font-weight:700;margin:0 15px;font-size:13px"></span>
      <button class="btn btn-sm btn-gray" onclick="statsState.idx++;renderStats()"><i class="ph ph-caret-right"></i></button>
      <button class="btn btn-sm btn-gray" onclick="statsState.idx=0;renderStats()" style="margin-left:auto">Today</button>
      <button class="btn btn-sm btn-outline" onclick="exportReport('statsContent','PNG')">Export PNG</button>
      <button class="btn btn-sm btn-outline" onclick="exportReport('statsContent','JPG')">Export JPG</button>
      <button class="btn btn-sm btn-outline" onclick="exportReport('statsContent','PDF')">Export PDF</button>
    </div>
    <div class="main-scroll" id="statsContent"></div>
  `;
  switchPeriod(statsState.period);
}

function switchPeriod(period) {
  statsState.period = period;
  document.querySelectorAll('#periodTabs .btn').forEach(b => {
    b.className = `btn btn-sm ${b.dataset.period===period?'btn-accent':'btn-outline'}`;
  });
  loadStats();
}

async function loadStats() {
  const res = await api(`/api/stats?period=${statsState.period}&idx=${statsState.idx}`);
  const d = await res.json();
  document.getElementById('statsLabel').textContent = d.label;

  let html = `<div class="card-grid" style="margin-bottom:16px">
    <div class="card" style="text-align:center;padding:20px"><div style="color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:0.04em">New Videos</div><div style="font-size:32px;font-weight:700;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums">${d.created.length}</div></div>
    <div class="card" style="text-align:center;padding:20px"><div style="color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:0.04em">In Progress</div><div style="font-size:32px;font-weight:700;color:#d4956b;margin-top:4px;font-variant-numeric:tabular-nums">${d.active.length}</div></div>
    <div class="card" style="text-align:center;padding:20px"><div style="color:var(--text-muted);font-size:11px;font-weight:600;letter-spacing:0.04em">Published</div><div style="font-size:32px;font-weight:700;color:var(--success);margin-top:4px;font-variant-numeric:tabular-nums">${d.published.length}</div></div>
  </div>`;

  if(Object.keys(d.status_counts).length) {
    html += '<h3 style="margin-bottom:8px;font-size:13px;font-weight:700;color:var(--text-secondary)">Status Distribution</h3><div class="check-row">';
    const sorted = Object.entries(d.status_counts).sort((a,b)=>b[1]-a[1]);
    for(const [st,cnt] of sorted) {
      html += `<span class="badge" style="background:${STATUS_COLORS[st]||'#554c44'}18;color:${STATUS_COLORS[st]||'var(--text)'};border:1px solid ${STATUS_COLORS[st]||'#554c44'}33">${st} &times;${cnt}</span>`;
    }
    html += '</div>';
  }

  const allCats = Object.keys(CATEGORIES);
  const hasData = allCats.some(k => (d.cat_created[k]||0)+(d.cat_active[k]||0)+(d.cat_published[k]||0) > 0);
  if(hasData) {
    html += '<h3 style="margin:16px 0 8px;font-size:13px;font-weight:700;color:var(--text-secondary)">Category Details</h3>';
    html += `<div class="card" style="overflow-x:auto;padding:14px"><table style="width:100%;font-size:12px;border-collapse:collapse">
      <tr style="color:var(--text-muted);font-weight:600;font-size:10.5px;letter-spacing:0.04em"><td style="padding:8px 12px">Category</td><td style="padding:8px 12px;text-align:center">New</td><td style="padding:8px 12px;text-align:center">In Progress</td><td style="padding:8px 12px;text-align:center">Published</td></tr>`;
    for(const k of allCats) {
      const cc=d.cat_created[k]||0, ca=d.cat_active[k]||0, cp=d.cat_published[k]||0;
      if(!cc&&!ca&&!cp) continue;
      html += `<tr><td style="padding:7px 12px;font-weight:500">${CATEGORIES[k]}</td><td style="padding:7px 12px;text-align:center;color:${cc?'var(--accent)':'var(--text-muted)'};font-weight:${cc?'600':'400'};font-variant-numeric:tabular-nums">${cc}</td><td style="padding:7px 12px;text-align:center;color:${ca?'#d4956b':'var(--text-muted)'};font-weight:${ca?'600':'400'};font-variant-numeric:tabular-nums">${ca}</td><td style="padding:7px 12px;text-align:center;color:${cp?'var(--success)':'var(--text-muted)'};font-weight:${cp?'600':'400'};font-variant-numeric:tabular-nums">${cp}</td></tr>`;
    }
    html += '</table></div>';
  } else {
    html += '<div class="empty">No video records for this period</div>';
  }

  html += '<h3 style="margin:20px 0 10px;font-size:13px;font-weight:700;color:var(--text-secondary)">Charts</h3><div id="chartsArea"></div>';

  document.getElementById('statsContent').innerHTML = html;

  setTimeout(() => renderCharts(d), 100);
}

function renderCharts(d) {
  const area = document.getElementById('chartsArea');
  if(!area) return;

  const catLabels = [], catValues = [];
  for(const [k,v] of Object.entries(d.cat_created)) {
    catLabels.push(CATEGORIES[k]||k); catValues.push(v);
  }

  const stLabels = Object.keys(d.status_counts);
  const stValues = Object.values(d.status_counts);
  const stColors = stLabels.map(s => STATUS_COLORS[s]||'#9a9490');

  const hasCatData = catValues.length && catValues.some(v=>v>0);
  const hasStData = stValues.length && stValues.some(v=>v>0);
  const hasTrend = d.trend.months && d.trend.months.length>0;

  if(!hasCatData && !hasStData && !hasTrend) {
    area.innerHTML = '<div class="empty">No chart data available</div>'; return;
  }

  area.innerHTML = `
    ${hasCatData ? '<div class="chart-wrap" style="max-width:480px"><canvas id="pieChart"></canvas></div>' : ''}
    ${hasStData ? '<div class="chart-wrap" style="max-width:500px"><canvas id="barChart"></canvas></div>' : ''}
    ${hasTrend ? '<div class="chart-wrap"><canvas id="lineChart"></canvas></div>' : ''}
  `;

  Chart.defaults.color = '#9494a8';
  Chart.defaults.borderColor = 'rgba(255,255,255,0.03)';

  if(hasCatData) {
    new Chart(document.getElementById('pieChart'), {
      type:'pie', data:{labels:catLabels,datasets:[{data:catValues,backgroundColor:['#c9946e','#d4956b','#4dab8e','#d4a843','#6ebccf','#e0556a','#8b6fbf','#c46a8a','#7a7a88','#5b8cc9','#3d9478','#c43b50']}]},
      options:{plugins:{legend:{position:'bottom',labels:{font:{size:10,family:"'Plus Jakarta Sans',sans-serif"},color:'#9494a8',padding:12},onClick:function(){return false}}}}
    });
  }

  if(hasStData) {
    new Chart(document.getElementById('barChart'), {
      type:'bar', data:{labels:stLabels,datasets:[{data:stValues,backgroundColor:stColors,borderRadius:4}]},
      options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#5c5c72',font:{size:10}}},y:{grid:{display:false},ticks:{color:'#9494a8',font:{size:10}}}}}
    });
  }

  if(hasTrend) {
    new Chart(document.getElementById('lineChart'), {
      type:'line', data:{labels:d.trend.months,datasets:[
        {label:'Created',data:d.trend.created,borderColor:'#c9946e',backgroundColor:'rgba(201,148,110,0.08)',tension:.35,fill:true,pointRadius:3,pointBackgroundColor:'#c9946e'},
        {label:'Published',data:d.trend.published,borderColor:'#4dab8e',backgroundColor:'rgba(77,171,142,0.08)',tension:.35,fill:true,pointRadius:3,pointBackgroundColor:'#4dab8e'}
      ]},
      options:{plugins:{legend:{labels:{color:'#9494a8',font:{size:11},padding:16,usePointStyle:true}}},scales:{x:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#5c5c72',font:{size:10}}},y:{grid:{color:'rgba(255,255,255,0.03)'},ticks:{color:'#5c5c72',font:{size:10}}}}}
    });
  }
}

// ── Trash ─────────────────────────────────────────────────────
async function renderTrash() {
  const main = document.getElementById('main');
  main.innerHTML = '<div class="empty" style="padding-top:80px">Loading...</div>';
  const res = await api('/api/trash');
  const d = await res.json();

  main.innerHTML = `
    <div class="toolbar"><h2 style="color:var(--danger)">Trash</h2><span style="color:var(--text-muted);font-size:11.5px">Deleted projects - restore or permanently delete</span></div>
    <div class="table-header">
      <span style="width:50px">ID</span><span style="width:330px">Name</span><span style="width:100px">Category</span><span style="width:140px">Deleted</span><span style="width:110px">Status</span>
    </div>
    <div class="main-scroll"><div class="scroll" id="trashList">${d.projects.length ? d.projects.map(r => {
      const cat = CATEGORIES[r.category]||r.category;
      const color = STATUS_COLORS[r.current_status]||'#fff';
      const dt = (r.updated_at||'').substring(0,16);
      return `<div class="row">
        <span style="width:50px"><input type="checkbox" data-pid="${r.id}"> ${r.id}</span>
        <span style="width:330px">${r.name}</span>
        <span style="width:100px">${cat}</span>
        <span style="width:140px;color:var(--text-muted)">${dt}</span>
        <span style="width:110px"><span style="color:${color}">&#9679;</span> ${r.current_status}</span>
      </div>`;
    }).join('') : '<div class="empty">Trash is empty</div>'}</div></div>
    <div class="check-row">
      <label style="font-size:12px;cursor:pointer"><input type="checkbox" id="trashSelectAll" onchange="document.querySelectorAll('#trashList input[type=checkbox]').forEach(c=>c.checked=this.checked)"> Select All</label>
      <button class="btn btn-sm btn-accent" onclick="trashRestore()"><i class="ph ph-arrow-u-up-left"></i> Restore</button>
      <button class="btn btn-sm btn-danger" onclick="trashPurge()"><i class="ph ph-x-circle"></i> Delete Forever</button>
      <button class="btn btn-sm btn-gray" style="margin-left:auto" onclick="trashClearAll()">Empty Trash</button>
    </div>
  `;
}

function getTrashSelectedIds() {
  return [...document.querySelectorAll('#trashList input[type=checkbox]:checked')].map(c=>parseInt(c.dataset.pid));
}

async function trashRestore() {
  const ids = getTrashSelectedIds(); if(!ids.length) return toast('No projects selected');
  const res = await api('/api/trash/restore', {method:'POST',body:JSON.stringify({ids})});
  const d = await res.json();
  toast(`Restored ${d.restored} projects`); renderTrash();
}

async function trashPurge() {
  const ids = getTrashSelectedIds(); if(!ids.length) return toast('No projects selected');
  if(!confirm(`Permanently delete ${ids.length} projects? This cannot be undone.`)) return;
  const res = await api('/api/trash/purge', {method:'POST',body:JSON.stringify({ids})});
  const d = await res.json();
  toast(`Permanently deleted ${d.purged} projects`); renderTrash();
}

async function trashClearAll() {
  if(!confirm('Permanently delete everything in trash? This cannot be undone.')) return;
  const res = await api('/api/trash/clear', {method:'POST'});
  const d = await res.json();
  toast(`Emptied trash (${d.purged} projects)`); renderTrash();
}

// ── Export ────────────────────────────────────────────────────
async function exportReport(elementId, format) {
  const el = document.getElementById(elementId);
  if (!el) return toast('Report content not found');

  if (format === 'PDF') {
    const origWidth = el.style.width;
    const origOverflow = el.style.overflow;
    const origMaxH = el.style.maxHeight;
    el.style.width = '780px';
    el.style.overflow = 'visible';
    el.style.maxHeight = 'none';

    const canvas = await html2canvas(el, {
      backgroundColor: '#0a0a12',
      scale: 2,
      logging: false,
    });

    el.style.width = origWidth;
    el.style.overflow = origOverflow;
    el.style.maxHeight = origMaxH;

    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/jpeg', 0.92);
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const imgW = pageW - 10;
    const imgH = (canvas.height * imgW) / canvas.width;

    let heightLeft = imgH;
    let position = 5;

    pdf.addImage(imgData, 'JPEG', 5, position, imgW, imgH);
    heightLeft -= pageH;

    while (heightLeft > 0) {
      position = heightLeft - imgH + 5;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 5, position, imgW, imgH);
      heightLeft -= pageH;
    }

    pdf.save(`report-${new Date().toISOString().slice(0,10)}.pdf`);
    toast('PDF downloading...');
    return;
  }

  const mime = format === 'JPG' ? 'image/jpeg' : 'image/png';
  const ext = format === 'JPG' ? 'jpg' : 'png';

  const origOverflow = el.style.overflow;
  const origMaxH = el.style.maxHeight;
  el.style.overflow = 'visible';
  el.style.maxHeight = 'none';

  const canvas = await html2canvas(el, {
    backgroundColor: '#0a0a12',
    scale: 2,
    logging: false,
  });

  el.style.overflow = origOverflow;
  el.style.maxHeight = origMaxH;

  const link = document.createElement('a');
  link.download = `report-${new Date().toISOString().slice(0,10)}.${ext}`;
  link.href = canvas.toDataURL(mime, 0.95);
  link.click();
  toast(`${format} downloading...`);
}

// ── Column Resize ──────────────────────────────────────────────
let colResize = null;

function injectResizeHandles() {
  document.querySelectorAll('.table-header').forEach(header => {
    header.querySelectorAll('span').forEach(span => {
      if (!span.querySelector('.resize-handle')) {
        const h = document.createElement('div');
        h.className = 'resize-handle';
        span.appendChild(h);
      }
    });
  });
}

function restoreColWidths() {
  const h2text = document.querySelector('#main h2')?.textContent || '';
  const pageKey = h2text.includes('Material') ? 'colWidths_v6_materials' : 'colWidths_v6_projects';
  const saved = localStorage.getItem(pageKey);
  if (!saved) return;
  const widths = JSON.parse(saved);
  document.querySelectorAll('.table-header').forEach(header => {
    const spans = header.querySelectorAll(':scope > span');
    widths.forEach((w, i) => { if (spans[i]) spans[i].style.width = w; });
    const container = header.nextElementSibling;
    if (container) {
      container.querySelectorAll('.row').forEach(row => {
        const rowSpans = row.querySelectorAll(':scope > span');
        widths.forEach((w, i) => { if (rowSpans[i]) rowSpans[i].style.width = w; });
      });
    }
  });
}

document.addEventListener('mousedown', e => {
  if (!e.target.classList.contains('resize-handle')) return;
  const span = e.target.parentElement;
  const header = span.parentElement;
  const idx = Array.from(header.children).indexOf(span);
  colResize = { header, span, idx, startX: e.clientX, startW: span.offsetWidth };
  e.target.classList.add('active');
  document.body.classList.add('col-resizing');
  e.preventDefault();
});

document.addEventListener('mousemove', e => {
  if (!colResize) return;
  const diff = e.clientX - colResize.startX;
  const newW = Math.max(40, colResize.startW + diff);
  colResize.span.style.width = newW + 'px';
  const container = colResize.header.nextElementSibling;
  if (container) {
    container.querySelectorAll('.row').forEach(row => {
      const spans = row.querySelectorAll(':scope > span');
      if (spans[colResize.idx]) spans[colResize.idx].style.width = newW + 'px';
    });
  }
});

document.addEventListener('mouseup', () => {
  if (colResize) {
    const h = colResize.span.querySelector('.resize-handle');
    if (h) h.classList.remove('active');
    document.body.classList.remove('col-resizing');
    const pageKey = 'colWidths_v6_' + (colResize.header.closest('#main')?.querySelector('h2')?.textContent?.includes('Material') ? 'materials' : 'projects');
    const widths = [];
    colResize.header.querySelectorAll('span').forEach(s => widths.push(s.style.width || s.offsetWidth+'px'));
    localStorage.setItem(pageKey, JSON.stringify(widths));
    colResize = null;
  }
});

// sync table-header horizontal scroll
document.addEventListener('scroll', e => {
  const t = e.target;
  if (t.classList.contains('main-scroll')) {
    const hdr = t.previousElementSibling;
    if (hdr && hdr.classList.contains('table-header')) hdr.scrollLeft = t.scrollLeft;
  }
}, true);

// ── Sidebar Resize ────────────────────────────────────────────
(function(){
  const sidebar = document.querySelector('.sidebar');
  const handle = document.getElementById('sidebarResize');
  let sbResize = null;

  const savedW = localStorage.getItem('sidebarWidth_v6');
  if (savedW) { const w = parseInt(savedW); if (w >= 140 && w <= 600) sidebar.style.width = w + 'px'; }

  handle.addEventListener('mousedown', e => {
    sbResize = { startX: e.clientX, startW: sidebar.offsetWidth };
    handle.classList.add('active');
    document.body.classList.add('sidebar-resizing');
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!sbResize) return;
    const diff = e.clientX - sbResize.startX;
    const newW = Math.max(140, Math.min(600, sbResize.startW + diff));
    sidebar.style.width = newW + 'px';
    localStorage.setItem('sidebarWidth_v6', newW);
  });

  document.addEventListener('mouseup', () => {
    if (sbResize) {
      handle.classList.remove('active');
      document.body.classList.remove('sidebar-resizing');
      sbResize = null;
    }
  });
})();

loadPage('projects');
